<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Controller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f1f3f2; --surface: #ffffff; --ink: #15202b; --muted: #566570; --line: #d3dbdf;
  --accent: #b4531b; --accent-ink: #ffffff;
  --ok: #17784a; --ok-soft: #dcf1e6; --warn: #8f5a00; --warn-soft: #fbefd2; --bad: #b3261e; --bad-soft: #fae1de;
  --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e151b; --surface: #161f27; --ink: #e6ecef; --muted: #96a5b0; --line: #2a3742;
    --accent: #e0864a; --accent-ink: #1a1006;
    --ok: #4cc38a; --ok-soft: #12362a; --warn: #e0a93b; --warn-soft: #3a2d0e; --bad: #f0776e; --bad-soft: #3d1a18;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
[hidden] { display: none !important; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.kicker { margin: 0; font: 600 14px var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 6px 0; font: 600 clamp(36px, 8vw, 56px)/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h2 { margin: 0; font: 600 22px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; }
h3 { margin: 0; font: 600 18px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.sub { margin: 0; color: var(--muted); }
.banner { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.nav { margin-top: 18px; display: flex; gap: 2px; overflow-x: auto; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.nav button { flex: 0 0 auto; padding: 8px 18px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 600 16px var(--f-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.nav .who { flex: 1 1 auto; }
.panel { margin-top: 16px; padding: 20px; display: grid; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.status { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; }
.lamp { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.lamp.open { background: var(--ok); box-shadow: 0 0 0 5px var(--ok-soft); }
.lamp.nogeo { background: var(--warn); box-shadow: 0 0 0 5px var(--warn-soft); }
.status-title { margin: 0; font-weight: 600; font-size: 17px; }
.status-meta { margin: 2px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.clock { font: 500 30px var(--f-mono); font-variant-numeric: tabular-nums; }
label, .lbl { display: block; margin-bottom: 6px; font: 600 14px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="date"], input[type="month"], input[type="email"], input[type="password"], select { width: 100%; min-width: 0; padding: 12px 14px; border: 1px solid var(--muted); border-radius: 8px; background: var(--surface); color: var(--ink); font: 500 16px var(--f-body); }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.btn { padding: 13px 24px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 600 18px var(--f-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--muted); }
.btn.small { padding: 9px 16px; font-size: 15px; }
.row { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
.row > div { min-width: 0; flex: 1 1 160px; }
.row.tight > * { flex: 0 0 auto; }
.chip { display: inline-block; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font: 500 13px var(--f-mono); color: var(--muted); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font: 600 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.muted { background: var(--line); color: var(--muted); }
.result { margin: 0; padding: 12px 14px; border-radius: 8px; font-weight: 500; overflow-wrap: anywhere; }
.result.ok { background: var(--ok-soft); color: var(--ok); }
.result.bad { background: var(--bad-soft); color: var(--bad); }
.result.warn { background: var(--warn-soft); color: var(--warn); }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
.classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.cls { position: relative; margin: 0; }
.cls input { position: absolute; opacity: 0; inset: 0; }
.cls span { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; font: 600 18px/1.15 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
.cls input:checked + span { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cls input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.livebox { padding: 16px; display: grid; gap: 12px; border: 1px solid var(--ok); border-radius: 8px; background: var(--ok-soft); }
.livebox .status-meta { color: var(--ink); opacity: .75; }
.count { margin: 0; font: 500 15px var(--f-mono); color: var(--muted); }
.count b { font-size: 26px; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.cell { padding: 10px 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; cursor: pointer; }
.cell.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.cell:disabled { cursor: default; opacity: .6; }
.confirm { padding: 14px; display: grid; gap: 10px; border: 1px solid var(--accent); border-radius: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.card { padding: 16px; display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.card.bad { border-color: var(--bad); }
.pct { font: 600 46px/1 var(--f-display); letter-spacing: .01em; }
.pct small { font-size: 20px; color: var(--muted); }
.bar { position: relative; height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar.short i { background: var(--bad); }
.bar b { position: absolute; top: 0; bottom: 0; left: 75%; width: 2px; background: var(--ink); }
.note { margin: 0; font-size: 14px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font: 600 13px var(--f-display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.day { min-height: 54px; padding: 6px 2px; display: grid; justify-items: center; align-content: space-between; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: 500 14px var(--f-mono); cursor: pointer; }
.day.empty { border: 0; cursor: default; }
.day.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.day.today { border-color: var(--accent); }
.dots { display: flex; gap: 3px; min-height: 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot.p { background: var(--ok); }
.dot.a { background: var(--bad); }
.dot.c { background: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
.t th, .t td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.t th { font: 600 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
.t td.mono, .t th.mono { font-family: var(--f-mono); }
.t td.c, .t th.c { text-align: center; }
.t td.p { background: var(--ok-soft); color: var(--ok); font-weight: 600; text-align: center; }
.t td.a { color: var(--muted); text-align: center; }
.t tr.short td { color: var(--bad); }
.t th button { border: 0; background: transparent; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.t th.cx { text-decoration: line-through; opacity: .6; }
.t .sticky { position: sticky; left: 0; background: var(--surface); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.list li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; overflow-wrap: anywhere; }
@media (max-width: 480px) { .status { grid-template-columns: auto minmax(0, 1fr); } .clock { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Rajkiya Engineering College, Ambedkar Nagar</p>
    <h1>Attendance Controller</h1>
    <p class="sub">Final year, Electrical Engineering. Roll numbers 2307370200001 to 2307370200070.</p>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* STEP 4 of SETUP.md: paste your own Firebase web config here. */
   const FIREBASE_CONFIG = {
     apiKey: "AIzaSyDheT6dkqkZz5rl6b1A9cs2t6fR5hhoQ5Q",
     authDomain: "attendancefinalyear-737.firebaseapp.com",
     projectId: "attendancefinalyear-737",
     appId: "1:656072006421:web:842066acad2a169373a71c"
   };
</script>

<script>
(() => {
  const PREFIX = '23073702', TOTAL = 70, RADIUS = 50, CRIT = 75;
  const DOMAIN = 'students.example.com';
  const CLASSES = [
    { id: 'epd', name: 'Electric Power Drives' },
    { id: 're', name: 'Renewable Energy' },
    { id: 'psp', name: 'Power System Protection' }
  ];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // ---------- small helpers ----------
  const $ = (id) => document.getElementById(id);
  const rollOf = (n) => PREFIX + String(n).padStart(5, '0');
  const ROLLS = Array.from({ length: TOTAL }, (_, i) => rollOf(i + 1));
  const emailOf = (roll) => roll + '@' + DOMAIN;
  const clsName = (id) => (CLASSES.find((c) => c.id === id) || {}).name || id;
  const validRoll = (r) => { if (!/^\d{13}$/.test(r) || r.slice(0, 8) !== PREFIX) return false; const n = parseInt(r.slice(8), 10); return n >= 1 && n <= TOTAL; };
  const istDate = (ms) => new Date((ms || Date.now()) + 19800000).toISOString().slice(0, 10);
  const fmtTime = (ms) => new Date(ms).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
  const fmtDate = (dk) => { const [y, m, d] = dk.split('-'); return parseInt(d, 10) + ' ' + MON[parseInt(m, 10) - 1] + ' ' + y; };
  const fmtMonth = (mk) => { const [y, m] = mk.split('-'); return MONTH_LONG[parseInt(m, 10) - 1] + ' ' + y; };
  const fmtClock = (ms) => { const s = Math.ceil(Math.max(0, ms) / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const isOpen = (l) => !!l && !l.closed && Date.now() < l.closesAt;
  const markKey = (cid, dk) => cid + '_' + dk;
  const fmtPct = (p) => (p == null ? '-' : p.toFixed(1) + '%');
  const haversine = (la1, lo1, la2, lo2) => {
    const R = 6371000, r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
    const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  };
  const getPos = () => new Promise((res, rej) => {
    if (!navigator.geolocation) return rej({ code: 0 });
    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
  const geoMsg = (e) => {
    if (e && e.code === 1) return 'Location is blocked. Allow location for this site in your browser settings and try again.';
    if (e && e.code === 3) return 'No GPS fix in time. Move near a window and try again.';
    return 'Your location could not be read on this device.';
  };
  // 75% maths. a = classes attended, h = classes held.
  const pctOf = (a, h) => (h > 0 ? (a * 100) / h : null);
  const needMore = (a, h) => Math.max(0, 3 * h - 4 * a);                      // attend this many in a row to reach 75%
  const canMiss = (a, h) => Math.max(0, Math.floor((4 * a) / 3 - h + 1e-9));  // can still miss this many and stay at 75%
  const isShort = (a, h) => h > 0 && a * 100 < CRIT * h;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    let val;
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'value') val = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'disabled' || k === 'checked' || k === 'hidden') e[k] = true;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(2)) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    if (val !== undefined) e.value = val;
    return e;
  }
  const banner = (t) => { const b = $('banner'); b.textContent = t || ''; b.hidden = !t; };
  const downloadCsv = (name, rows) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n')], { type: 'text/csv' }));
    a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // ---------- state ----------
  let auth = null, db = null, FV = null, FP = null;
  const today = istDate();
  const S = {
    ready: false, user: null, role: null, roll: null, activated: false,
    live: null, calendar: {}, myMarks: {}, records: new Map(), students: new Map(), audit: null,
    tab: 'day', cls: 'epd', date: today, regCls: 'epd', regMonth: today.slice(0, 7),
    chkScope: 'all', chkOnly: true, month: today.slice(0, 7), selDate: today,
    pending: null, msgs: {}, codes: null, busy: false
  };
  let unsubs = [], rq = 0, wasOpen = false;
  const msg = (k, text, kind) => { S.msgs[k] = text ? { text, kind } : null; render(); };
  const msgEl = (k) => { const m = S.msgs[k]; return m ? h('p', { class: 'result ' + (m.kind || ''), role: 'status' }, m.text) : null; };

  // ---------- data helpers ----------
  const datesOf = (cid) => (S.calendar[cid] && S.calendar[cid].dates) || {};
  const heldDates = (cid) => Object.keys(datesOf(cid)).filter((d) => !datesOf(cid)[d].cancelled).sort();
  function statFor(marks, cid) {
    const dates = heldDates(cid); let a = 0;
    if (marks) for (const d of dates) if (marks[markKey(cid, d)]) a++;
    return { held: dates.length, att: a };
  }
  function statAll(marks) {
    let held = 0, att = 0;
    for (const c of CLASSES) { const s = statFor(marks, c.id); held += s.held; att += s.att; }
    return { held, att };
  }
  function markText(m) {
    if (!m) return 'Absent';
    if (m.method === 'manual') return 'Present, marked by professor' + (m.reason ? ' (' + m.reason + ')' : '') + ' at ' + fmtTime(m.ts);
    return 'Present at ' + fmtTime(m.ts) + (m.dist != null ? ', ' + m.dist + ' m from the classroom' : '');
  }

  // ---------- rendering ----------
  function render() { cancelAnimationFrame(rq); rq = requestAnimationFrame(doRender); }
  function doRender() {
    const app = $('app');
    app.replaceChildren();
    if (!S.ready) return;
    if (!S.user) { app.append(viewLogin()); return; }
    if (S.role === 'student') {
      if (!S.activated) { app.append(viewSetPassword()); return; }
      app.append(navBar([['dash', 'My attendance']], 'dash'), viewStudent());
      return;
    }
    app.append(navBar([['day', 'Day'], ['reg', 'Register'], ['chk', '75% check'], ['stu', 'Students'], ['log', 'Changes']], S.tab));
    app.append(({ day: viewDay, reg: viewRegister, chk: viewCheck, stu: viewStudents, log: viewLog }[S.tab] || viewDay)());
  }
  function navBar(items, cur) {
    return h('nav', { class: 'nav' },
      items.map(([id, label]) => h('button', { type: 'button', 'aria-selected': String(id === cur), onclick: () => { S.tab = id; S.pending = null; if (id === 'log') loadAudit(); render(); } }, label)),
      h('span', { class: 'who' }),
      h('button', { type: 'button', onclick: () => auth.signOut() }, 'Log out'));
  }

  // ---------- login ----------
  function viewLogin() {
    const id = h('input', { type: 'text', id: 'lid', autocomplete: 'username', placeholder: '2307370200001', spellcheck: 'false' });
    const pw = h('input', { type: 'password', id: 'lpw', autocomplete: 'current-password' });
    const out = h('p', { class: 'result', hidden: true, role: 'status' });
    const say = (t, k) => { out.textContent = t; out.className = 'result ' + k; out.hidden = !t; };
    async function go() {
      const v = id.value.trim();
      if (!v || !pw.value) return say('Enter your ID and password.', 'bad');
      let email = v;
      if (/^\d+$/.test(v)) { if (!validRoll(v)) return say('That roll number is not in this class.', 'bad'); email = emailOf(v); }
      say('Logging in', 'warn');
      try { await auth.signInWithEmailAndPassword(email, pw.value); }
      catch (e) {
        say(e && e.code === 'auth/too-many-requests' ? 'Too many tries. Wait a few minutes and try again.' : 'ID or password is wrong.', 'bad');
      }
    }
    pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    return h('div', { class: 'panel' },
      h('h2', null, 'Log in'),
      h('div', null, h('label', { for: 'lid' }, 'College ID (roll number)'), id, h('p', { class: 'hint' }, 'Professors use their email here.')),
      h('div', null, h('label', { for: 'lpw' }, 'Password'), pw),
      h('p', { class: 'hint' }, 'First time? Your password is the activation code your professor gave you. You will choose your own password right after.'),
      h('div', null, h('button', { class: 'btn', type: 'button', onclick: go }, 'Log in')),
      out);
  }
  function viewSetPassword() {
    const p1 = h('input', { type: 'password', id: 'np1', autocomplete: 'new-password' });
    const p2 = h('input', { type: 'password', id: 'np2', autocomplete: 'new-password' });
    const out = h('p', { class: 'result', hidden: true, role: 'status' });
    const say = (t, k) => { out.textContent = t; out.className = 'result ' + k; out.hidden = !t; };
    async function go() {
      if (p1.value.length < 8) return say('Use at least 8 characters.', 'bad');
      if (p1.value !== p2.value) return say('The two passwords do not match.', 'bad');
      say('Saving', 'warn');
      try {
        await auth.currentUser.updatePassword(p1.value);
        await db.doc('students/' + S.user.uid).update({ activated: true });
        S.activated = true; startStudent(); render();
      } catch (e) {
        say(e && e.code === 'auth/requires-recent-login' ? 'Please log out and log in again, then set the password.' : 'Could not save the password. Try again.', 'bad');
      }
    }
    return h('div', { class: 'panel' },
      h('h2', null, 'Choose your password'),
      h('p', { class: 'note' }, 'Logged in as ' + S.roll + '. Set a password only you know. You will use it from now on.'),
      h('div', null, h('label', { for: 'np1' }, 'New password'), p1),
      h('div', null, h('label', { for: 'np2' }, 'Repeat password'), p2),
      h('div', null, h('button', { class: 'btn', type: 'button', onclick: go }, 'Save password')),
      out);
  }

  // ---------- student ----------
  function summaryCard(title, a, hd, extra) {
    const p = pctOf(a, hd), short = isShort(a, hd);
    let line;
    if (hd === 0) line = 'No class has been held yet.';

        h('tbody', null, shown.length ? shown.map((x) => h('tr', { class: x.short ? 'short' : '' },
          h('td', { class: 'mono' }, x.roll), h('td', { class: 'c' }, x.att), h('td', { class: 'c' }, x.held), h('td', { class: 'c' }, fmtPct(x.pct)),
          h('td', null, h('span', { class: 'pill ' + (x.held === 0 ? 'muted' : x.short ? 'bad' : 'ok') }, x.held === 0 ? 'No classes' : x.short ? 'Below 75%' : 'Eligible')),
          h('td', { class: 'c' }, x.short ? needMore(x.att, x.held) + ' in a row' : '-'))) : h('tr', null, h('td', { colspan: '6' }, 'Nobody is below 75%.'))))),
      h('p', { class: 'hint' }, '"Needs" is how many classes in a row the student must attend to reach 75%. Cancelled classes are not counted. Use this list to decide who is not allowed in the exam.'));
  }

  // ---------- professor: Students (accounts) ----------
  const makeCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const b = new Uint32Array(8); crypto.getRandomValues(b); return Array.from(b, (x) => A[x % A.length]).join(''); };
  function viewStudents() {
    const have = new Map(); S.students.forEach((v) => have.set(v.roll, v));
    const missing = ROLLS.filter((r) => !have.has(r)).length, pending = ROLLS.filter((r) => have.has(r) && !have.get(r).activated).length;
    return h('div', { class: 'panel' },
      h('h2', null, 'Student accounts'),
      h('p', { class: 'note' }, h('b', null, String(TOTAL - missing)), ' of ' + TOTAL + ' accounts created. ' + pending + ' students have not set their own password yet.'),
      h('div', { class: 'row tight' },
        h('button', { class: 'btn', type: 'button', disabled: S.busy || missing === 0, onclick: createAccounts }, 'Create ' + missing + ' missing accounts'),
        S.codes && S.codes.length ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => downloadCsv('activation-codes-' + today + '.csv', [['Roll number', 'Activation code']].concat(S.codes)) }, 'Download activation codes') : null),
      msgEl('stu'),
      h('p', { class: 'hint' }, 'Each student gets a one-time activation code. They log in with their roll number and that code, then choose their own password. The codes exist only on this screen: download them right after creating, and hand each student only their own.'),
      h('div', { class: 'tablewrap' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, h('th', { class: 'mono' }, 'Roll number'), h('th', null, 'Account'), h('th', null, 'Own password'))),
        h('tbody', null, ROLLS.map((r) => { const s = have.get(r); return h('tr', null, h('td', { class: 'mono' }, r), h('td', null, s ? 'Created' : 'Not created'), h('td', null, s ? (s.activated ? 'Set' : 'Not yet') : '-')); })))));
  }
  async function createAccounts() {
    S.busy = true; S.codes = S.codes || []; msg('stu', 'Creating accounts. Keep this page open.', 'warn');
    let sec = firebase.apps.find((a) => a.name === 'sec');
    if (!sec) sec = firebase.initializeApp(FIREBASE_CONFIG, 'sec');
    const sa = sec.auth(), have = new Set(); S.students.forEach((v) => have.add(v.roll));
    let made = 0, stuck = [];
    try {
      for (const roll of ROLLS) {
        if (have.has(roll)) continue;
        const code = makeCode();
        try {
          const cred = await sa.createUserWithEmailAndPassword(emailOf(roll), code);
          await db.doc('students/' + cred.user.uid).set({ roll, activated: false, createdAt: Date.now() });
          S.codes.push([roll, code]); made++; await sa.signOut();
        } catch (e) {
          if (e && e.code === 'auth/email-already-in-use') stuck.push(roll);
          else if (e && e.code === 'auth/too-many-requests') { S.busy = false; if (S.codes.length) downloadCsv('activation-codes-' + today + '.csv', [['Roll number', 'Activation code']].concat(S.codes)); return msg('stu', made + ' accounts created, then Firebase asked to slow down. Wait an hour and press the button again. The codes created so far were downloaded.', 'warn'); }
          else { S.busy = false; if (S.codes.length) downloadCsv('activation-codes-' + today + '.csv', [['Roll number', 'Activation code']].concat(S.codes)); return msg('stu', 'Stopped at ' + roll + ' after ' + made + ' accounts. Check that Email/Password sign-in is on, then press the button again.', 'bad'); }
        }
      }
      S.busy = false;
      if (S.codes.length) downloadCsv('activation-codes-' + today + '.csv', [['Roll number', 'Activation code']].concat(S.codes));
      msg('stu', made + ' accounts created and the activation codes were downloaded.' + (stuck.length ? ' ' + stuck.length + ' roll numbers already have a login but no record here (' + stuck.slice(0, 3).join(', ') + (stuck.length > 3 ? ', ...' : '') + '). Delete those users in Firebase, Authentication, then press the button again.' : ''), stuck.length ? 'warn' : 'ok');
    } catch (_) { S.busy = false; msg('stu', 'Something went wrong. Press the button again to continue.', 'bad'); }
  }

  // ---------- professor: Changes log ----------
  async function loadAudit() {
    try { const s = await db.collection('audit').orderBy('ts', 'desc').limit(100).get(); S.audit = s.docs.map((d) => d.data()); }
    catch (_) { S.audit = []; }
    render();
  }
  function viewLog() {
    const label = { mark: 'Marked present', unmark: 'Removed attendance', 'cancel-class': 'Cancelled class', 'restore-class': 'Counted class again' };
    return h('div', { class: 'panel' },
      h('div', { class: 'row tight' }, h('h2', null, 'Changes log'), h('button', { class: 'btn ghost small', type: 'button', onclick: loadAudit }, 'Refresh')),
      h('p', { class: 'hint' }, 'Every manual change is kept here with who made it and why. Latest 100.'),
      S.audit == null ? h('p', { class: 'note' }, 'Loading') : S.audit.length === 0 ? h('p', { class: 'note' }, 'No manual changes yet.') :
        h('ul', { class: 'list' }, S.audit.map((a) => h('li', null, h('b', null, label[a.action] || a.action), (a.roll ? ' ' + a.roll : ''), ' for ' + clsName(a.classId) + ' on ' + fmtDate(a.dateKey), a.reason ? '. Reason: ' + a.reason : '', h('br'), h('span', { class: 'hint' }, fmtDate(istDate(a.ts)) + ' ' + fmtTime(a.ts) + ' by ' + a.by)))));
  }

  // ---------- live clocks ----------
  setInterval(() => {
    document.querySelectorAll('.js-clock').forEach((el) => { el.textContent = fmtClock(parseInt(el.dataset.close, 10) - Date.now()); });
    const o = isOpen(S.live);
    if (o !== wasOpen) { wasOpen = o; render(); }
  }, 1000);

  // ---------- subscriptions ----------
  const stopAll = () => { unsubs.forEach((u) => { try { u(); } catch (_) {} }); unsubs = []; };
  const onErr = () => banner('Some data could not be loaded. Reload the page.');
  function watchShared() {
    unsubs.push(db.doc('live/current').onSnapshot((s) => { S.live = s.exists ? s.data() : null; render(); }, onErr));
    unsubs.push(db.collection('calendar').onSnapshot((s) => { const c = {}; s.docs.forEach((d) => { c[d.id] = d.data(); }); S.calendar = c; render(); }, onErr));
  }
  function startStudent() {
    stopAll(); watchShared();
    unsubs.push(db.doc('records/' + S.roll).onSnapshot((s) => { S.myMarks = s.exists ? (s.data().marks || {}) : {}; render(); }, onErr));
  }
  function startProf() {
    stopAll(); watchShared();
    unsubs.push(db.collection('records').onSnapshot((s) => { const m = new Map(); s.docs.forEach((d) => m.set(d.id, d.data().marks || {})); S.records = m; render(); }, onErr));
    unsubs.push(db.collection('students').onSnapshot((s) => { const m = new Map(); s.docs.forEach((d) => m.set(d.id, d.data())); S.students = m; render(); }, onErr));
  }

  // ---------- boot ----------
  const configured = FIREBASE_CONFIG.apiKey && !/^PASTE/.test(FIREBASE_CONFIG.apiKey);
  if (!window.firebase) { banner('Could not load Firebase. Check your internet connection and reload.'); return; }
  if (!configured) { banner('Firebase is not set up yet. Follow SETUP.md and paste your config into index.html.'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.firestore(); FV = firebase.firestore.FieldValue; FP = firebase.firestore.FieldPath;
  auth.onAuthStateChanged(async (u) => {
    stopAll(); S.user = u; S.ready = true; S.live = null; S.myMarks = {}; S.records = new Map(); S.students = new Map(); S.pending = null; S.msgs = {}; S.audit = null;
    if (!u) { S.role = null; render(); return; }
    const em = u.email || '';
    if (em.endsWith('@' + DOMAIN)) {
      S.role = 'student'; S.roll = em.split('@')[0];
      try {
        const d = await db.doc('students/' + u.uid).get();
        if (!d.exists || d.data().roll !== S.roll) { banner('Your account is not set up for this class. Ask your professor.'); auth.signOut(); return; }
        S.activated = !!d.data().activated; banner('');
        if (S.activated) startStudent();
      } catch (_) { banner('Could not load your account. Reload the page.'); }
    } else { S.role = 'prof'; S.tab = 'day'; banner(''); startProf(); }
    render();
  });
  render();
})();
</script>
</body>
</html>
