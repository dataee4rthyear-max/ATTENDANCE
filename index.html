  --ok: #17784a; --ok-soft: #dcf1e6; --warn: #8f5a00; --warn-soft: #fbefd2; --bad: #b3261e; --bad-soft: #fae1de;
  --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;

}

    --ok: #4cc38a; --ok-soft: #12362a; --warn: #e0a93b; --warn-soft: #3a2d0e; --bad: #f0776e; --bad-soft: #3d1a18;
  }
}
* { box-sizing: border-box; }

header { padding-bottom: 18px; border-bottom: 1px solid var(--line); }

.sub { margin: 0; color: var(--muted); }

.nav button { flex: 0 0 auto; padding: 8px 18px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 600 16px var(--f-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.panel { margin-top: 16px; padding: 20px; display: grid; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.status { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; }
.lamp { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }

.lamp.nogeo { background: var(--warn); box-shadow: 0 0 0 5px var(--warn-soft); }
.status-title { margin: 0; font-weight: 600; font-size: 17px; }

.clock { font: 500 30px var(--f-mono); font-variant-numeric: tabular-nums; }
label, .lbl { display: block; margin-bottom: 6px; font: 600 14px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.btn { padding: 13px 24px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 600 18px var(--f-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.row { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
.row > div { min-width: 0; flex: 1 1 160px; }
.row.tight > * { flex: 0 0 auto; }
.chip { display: inline-block; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font: 500 13px var(--f-mono); color: var(--muted); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font: 600 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.muted { background: var(--line); color: var(--muted); }
.result { margin: 0; padding: 12px 14px; border-radius: 8px; font-weight: 500; overflow-wrap: anywhere; }
.result.ok { background: var(--ok-soft); color: var(--ok); }
.result.bad { background: var(--bad-soft); color: var(--bad); }
.result.warn { background: var(--warn-soft); color: var(--warn); }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
.classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.cls { position: relative; margin: 0; }
.cls input { position: absolute; opacity: 0; inset: 0; }
.cls span { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; font: 600 18px/1.15 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
.cls input:checked + span { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cls input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.livebox { padding: 16px; display: grid; gap: 12px; border: 1px solid var(--ok); border-radius: 8px; background: var(--ok-soft); }
.livebox .status-meta { color: var(--ink); opacity: .75; }
.count { margin: 0; font: 500 15px var(--f-mono); color: var(--muted); }
.count b { font-size: 26px; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.cell { padding: 10px 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; cursor: pointer; }
.cell.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.cell:disabled { cursor: default; opacity: .6; }
.confirm { padding: 14px; display: grid; gap: 10px; border: 1px solid var(--accent); border-radius: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }

.bar { position: relative; height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar.short i { background: var(--bad); }
.bar b { position: absolute; top: 0; bottom: 0; left: 75%; width: 2px; background: var(--ink); }
.note { margin: 0; font-size: 14px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font: 600 13px var(--f-display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.day { min-height: 54px; padding: 6px 2px; display: grid; justify-items: center; align-content: space-between; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: 500 14px var(--f-mono); cursor: pointer; }
.day.empty { border: 0; cursor: default; }
.day.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.day.today { border-color: var(--accent); }
.dots { display: flex; gap: 3px; min-height: 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot.p { background: var(--ok); }
.dot.a { background: var(--bad); }
.dot.c { background: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
.t th, .t td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.t th { font: 600 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
.t td.mono, .t th.mono { font-family: var(--f-mono); }
.t td.c, .t th.c { text-align: center; }
.t td.p { background: var(--ok-soft); color: var(--ok); font-weight: 600; text-align: center; }
.t td.a { color: var(--muted); text-align: center; }
.t tr.short td { color: var(--bad); }
.t th button { border: 0; background: transparent; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.t th.cx { text-decoration: line-through; opacity: .6; }
.t .sticky { position: sticky; left: 0; background: var(--surface); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.list li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; overflow-wrap: anywhere; }
@media (max-width: 480px) { .status { grid-template-columns: auto minmax(0, 1fr); } .clock { grid-column: 1 / -1; } }
.day.hol { background: var(--warn-soft); }
textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--muted); border-radius: 8px; background: var(--surface); color: var(--ink); font: 500 15px var(--f-mono); }
.batchbar { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 12px; }
.batchbar > div { flex: 1 1 200px; }

/* ---- premium theme ---- */
:root { --bg:#f3f4fb; --surface:#fff; --ink:#0f1530; --muted:#5b6482; --line:#e3e6f1; --accent:#4338ca; --accent-ink:#fff; --ok:#0f8a5f; --ok-soft:#dcf5ea; --warn:#92600a; --warn-soft:#fdf1d3; --bad:#c2312a; --bad-soft:#fde4e2;

  --shadow:0 1px 2px rgba(15,21,48,.05),0 8px 24px rgba(15,21,48,.07); --grad:linear-gradient(135deg,#6d5dfc,#4338ca); }

  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --grad:linear-gradient(135deg,#8b8cff,#5b5be0); } }

label,.lbl { font: 700 12px var(--f-body); letter-spacing: .08em; }

header.hero { display: flex; gap: 16px; align-items: center; padding: 20px 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
.logo { width: 58px; height: 58px; flex: 0 0 auto; filter: drop-shadow(0 6px 10px rgba(67,56,202,.3)); }

input[type="text"],input[type="date"],input[type="month"],input[type="email"],input[type="password"],select,textarea { border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }

/* ---- AgixOn Obsidian theme (dark, always) ---- */
:root, :root * { color-scheme: dark; }
:root { --bg:#090b10; --surface:#0f1218; --surface2:#151a23; --ink:#e8ecf4; --muted:#8c97ad; --line:rgba(255,255,255,.08);
  --accent:#818cf8; --accent-ink:#0a0c14; --ok:#34d399; --ok-soft:rgba(52,211,153,.12); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.12); --shadow:0 0 0 1px rgba(255,255,255,.04),0 12px 32px rgba(0,0,0,.45);
  --grad:linear-gradient(135deg,#6366f1,#22d3ee); }

body { background: radial-gradient(900px 420px at 50% -160px, rgba(99,102,241,.22), transparent 70%), radial-gradient(600px 300px at 90% 0, rgba(34,211,238,.10), transparent 70%), var(--bg); }

<script>
(() => {
  let TOTAL = 0; const RADIUS = 35, ACC_MAX = 40, CRIT = 75;   // metres: max distance from the teacher / max GPS error allowed
  const DOMAIN = 'students.example.com';
  // Branch accounts: each branch has ONE account (HOD + faculty + admin of that branch only). Must match mgrBranch() in firestore.rules.
  const BRANCHES = [
    { key: 'apsh', name: 'APSH (First Year)', email: 'admin.apsh@gmail.com' },
    { key: 'ee', name: 'Electrical Engineering', email: 'admin.ee@gmail.com' },
    { key: 'ce', name: 'Civil Engineering', email: 'admin.ce@gmail.com' },
    { key: 'it', name: 'Information Technology', email: 'admin.it@gmail.com' }
  ];
  // Director = view only, all branches. Must match directorEmails() in firestore.rules.
  const DIRECTOR_EMAILS = ['director.all@gmail.com'];
  const MGR = {}; BRANCHES.forEach((x) => { MGR[x.email] = x.name; });
  const bkOf = (name) => (BRANCHES.find((x) => x.name === name) || {}).key || '';
  const mergeCfg = (docs) => {
    const o = { branches: S.isDirector ? BRANCHES.map((x) => x.name) : [S.role === 'student' ? (S.sbatch || '').split('|')[0] : S.mgrBranch], years: [], subjects: [], sessions: [], holidays: {}, workdays: [] };
    Object.keys(docs).forEach((k) => { const d = docs[k]; o.years = o.years.concat(d.years || []); o.subjects = o.subjects.concat(d.subjects || []); o.sessions = o.sessions.concat(d.sessions || []); Object.assign(o.holidays, d.holidays || {}); o.workdays = o.workdays.concat(d.workdays || []); if (d.activeSession && !o.activeSession) o.activeSession = d.activeSession; });
    o.years = [...new Set(o.years)]; o.sessions = [...new Set(o.sessions)]; o.workdays = [...new Set(o.workdays)];
    return o;
  };
  let CLASSES = [], ROLLS = [], NAMES = {};
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // ---------- small helpers ----------
  const $ = (id) => document.getElementById(id);
  const emailOf = (roll, v) => roll + (v ? '.r' + v : '') + '@' + DOMAIN;
  const clsName = (id) => (CLASSES.find((c) => c.id === id) || {}).name || id;
  const istDate = (ms) => new Date((ms || Date.now()) + 19800000).toISOString().slice(0, 10);
  const fmtTime = (ms) => new Date(ms).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
  const fmtDate = (dk) => { const [y, m, d] = dk.split('-'); return parseInt(d, 10) + ' ' + MON[parseInt(m, 10) - 1] + ' ' + y; };
  const fmtMonth = (mk) => { const [y, m] = mk.split('-'); return MONTH_LONG[parseInt(m, 10) - 1] + ' ' + y; };
  const fmtClock = (ms) => { const s = Math.ceil(Math.max(0, ms) / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const isOpen = (l) => !!l && !l.closed && Date.now() < l.closesAt;
  const markKey = (cid, dk) => cid + '_' + dk;
  const fmtPct = (p) => (p == null ? '-' : p.toFixed(1) + '%');
  const haversine = (la1, lo1, la2, lo2) => {
    const R = 6371000, r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
    const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  };
  const getPos = () => new Promise((res, rej) => {
    if (!navigator.geolocation) return rej({ code: 0 });
    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
  const geoMsg = (e) => {
    if (e && e.code === 1) return 'Location is blocked. Allow location for this site in your browser settings and try again.';
    if (e && e.code === 3) return 'No GPS fix in time. Move near a window and try again.';
    return 'Your location could not be read on this device.';
  };
  // 75% maths. a = classes attended, h = classes held.
  const pctOf = (a, h) => (h > 0 ? (a * 100) / h : null);
  const needMore = (a, h) => Math.max(0, 3 * h - 4 * a);                      // attend this many in a row to reach 75%
  const canMiss = (a, h) => Math.max(0, Math.floor((4 * a) / 3 - h + 1e-9));  // can still miss this many and stay at 75%
  const isShort = (a, h) => h > 0 && a * 100 < CRIT * h;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    let val;
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'value') val = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'disabled' || k === 'checked' || k === 'hidden') e[k] = true;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(2)) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    if (val !== undefined) e.value = val;
    return e;
  }
  const banner = (t) => { const b = $('banner'); b.textContent = t || ''; b.hidden = !t; };
  const downloadCsv = (name, rows) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n')], { type: 'text/csv' }));
    a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // ---------- state ----------
  let auth = null, db = null, FV = null, FP = null;
  let today = istDate();
  const S = {
    ready: false, user: null, role: null, roll: null, activated: false,
    lives: {}, secrets: {}, ccodes: {}, ovRecords: new Map(), calendar: {}, myMarks: {}, records: new Map(), students: new Map(), audit: null,
    tab: 'day', cls: 'epd', date: today, regCls: 'epd', regMonth: today.slice(0, 7),
    chkScope: 'all', chkOnly: true, month: today.slice(0, 7), selDate: today,
    pending: null, msgs: {}, codes: null, busy: false
  };
  let unsubs = [], rq = 0, wasOpen = false;
  const msg = (k, text, kind) => { S.msgs[k] = text ? { text, kind } : null; render(); };
  const msgEl = (k) => { const m = S.msgs[k]; return m ? h('p', { class: 'result ' + (m.kind || ''), role: 'status' }, m.text) : null; };

  // ---------- data helpers ----------
  const datesOf = (cid) => (S.calendar[cid] && S.calendar[cid].dates) || {};
  const heldDates = (cid) => Object.keys(datesOf(cid)).filter((d) => !datesOf(cid)[d].cancelled).sort();
  // Every attendance window has its own document per class, so many teachers can run theirs at once.
  const liveFor = (cid) => S.lives[cid] || null;
  const openLives = () => Object.values(S.lives).filter((l) => isOpen(l));
  // Retention: records, calendar and the change log carry expireAt (5 years). Turn on Firestore TTL for that field.
  const LOCK_MS = 12 * 3600000, RETAIN_MS = Math.round(5 * 365.25 * 86400000);
  const expireTs = () => firebase.firestore.Timestamp.fromMillis(Date.now() + RETAIN_MS);
  const addDays = (dk, n) => istDate(new Date(dk + 'T00:00:00+05:30').getTime() + n * 86400000);
  const dayEnd = (dk) => new Date(dk + 'T00:00:00+05:30').getTime() + 86400000;
  // A class day locks 12 hours after the class window ended. After that only the Admin can correct it.
  const isLocked = (cid, dk) => { const i = datesOf(cid)[dk]; return Date.now() > (i && i.endedAt ? i.endedAt : dayEnd(dk)) + LOCK_MS; };
  const cancelKeys = (cal) => { const k = new Set(); Object.keys(cal).forEach((cid) => { const ds = (cal[cid] && cal[cid].dates) || {}; Object.keys(ds).forEach((d) => { if (ds[d].cancelled) k.add(cid + '|' + d); }); }); return k; };
  function notifyCancels(oldCal, newCal) {
    const before = cancelKeys(oldCal), mine = ((S.config && S.config.subjects) || []).filter((x) => x.branch + '|' + x.year === S.sbatch);
    cancelKeys(newCal).forEach((k) => {
      if (before.has(k)) return; const [cid, d] = k.split('|'), sub = mine.find((x) => x.id === cid); if (!sub) return;
      const text = sub.name + ' on ' + fmtDate(d) + ' is cancelled.'; banner('Class cancelled: ' + text);
      try { if (window.Notification && Notification.permission === 'granted') new Notification('Class cancelled', { body: text }); } catch (_) {}
    });
  }
  function statFor(marks, cid) {
    const dates = heldDates(cid); let a = 0;
    if (marks) for (const d of dates) if (marks[markKey(cid, d)]) a++;
    return { held: dates.length, att: a };
  }
  function statAll(marks) {
    let held = 0, att = 0;
    for (const c of CLASSES) { const s = statFor(marks, c.id); held += s.held; att += s.att; }
    return { held, att };
  }
  function markText(m) {
    if (!m) return 'Absent';
    if (m.method === 'manual') return 'Present, marked by professor' + (m.reason ? ' (' + m.reason + ')' : '') + ' at ' + fmtTime(m.ts);
    return 'Present at ' + fmtTime(m.ts) + (m.dist != null ? ', ' + m.dist + ' m from the classroom' : '');
  }

  const devId = () => {
    try {
      let d = localStorage.getItem('agx_dev');
      if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, '0')).join(''); localStorage.setItem('agx_dev', d); }
      return d;
    } catch (_) { return ''; }
  };

  // ---------- branch / year / holidays ----------
  const branchesOf = () => { const b = (S.config && S.config.branches) || []; return S.hodOnly ? b.filter((x) => x === S.hodBranch) : b; };
  const yearsOf = () => (S.config && S.config.years) || [];
  // Sessions: a session such as 2026-27 is stored in config.sessions and also read from year names ("Final Year 2026-27").
  const SESS_RE = /\d{4}\s*-\s*\d{2,4}/;
  const sessOfYear = (y) => ((String(y).match(SESS_RE) || ['General'])[0]).replace(/\s/g, '');
  const sessionsOf = () => [...new Set(((S.config && S.config.sessions) || []).concat(yearsOf().map(sessOfYear)))].sort().reverse();
  const activeSess = () => { const l = sessionsOf(), a = S.config && S.config.activeSession; return l.includes(a) ? a : (l.find((x) => x !== 'General') || l[0]); };
  const isPast = () => !!S.session && S.session !== activeSess();
  const yearsInSession = () => yearsOf().filter((y) => sessOfYear(y) === S.session);
  // Sundays and four fixed national days are shown automatically. Every other holiday comes from the Admin's list (the college's
  // official list), because festival dates follow the moon and differ between sources. The Admin can mark any day as a working day.
  const FIXED_HOL = { '01-26': 'Republic Day', '08-15': 'Independence Day', '10-02': 'Gandhi Jayanti', '12-25': 'Christmas' };
  const autoHoliday = (dk) => FIXED_HOL[dk.slice(5)] || (new Date(dk + 'T00:00:00Z').getUTCDay() === 0 ? 'Sunday' : undefined);
  const holiday = (dk) => { const c = S.config || {}; if ((c.workdays || []).includes(dk)) return undefined; return (c.holidays || {})[dk] || autoHoliday(dk); };
  function nextHoliday() { for (let i = 1; i <= 45; i++) { const dk = addDays(today, i), n = holiday(dk); if (n && n !== 'Sunday') return { dk, name: n }; } return null; }
  function todayStrip() {
    const hol = holiday(today), nx = nextHoliday();
    const label = new Date(today + 'T12:00:00+05:30').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Asia/Kolkata' });
    return h('div', { class: 'todaystrip' + (hol ? ' off' : '') },
      h('div', null, h('b', null, label), h('div', { class: 'hint' }, hol ? 'Holiday: ' + hol + '. The college is closed today.' : 'No holiday is listed for today.' + (nx ? ' Next holiday: ' + nx.name + ', ' + fmtDate(nx.dk) + '.' : ''))),
      h('span', { class: 'pill ' + (hol ? 'bad' : 'ok') }, hol ? 'Holiday' : 'No holiday listed'));
  }
  const curBatch = () => {
    const sl = sessionsOf();
    if (!sl.includes(S.session)) { let v = null; try { v = localStorage.getItem('agx_sess'); } catch (_) {} S.session = sl.includes(v) ? v : activeSess(); }
    const b = branchesOf(), y = yearsInSession();
    if (!b.includes(S.branch)) S.branch = b[0]; if (!y.includes(S.year)) S.year = y[0];
    return (S.branch || '') + '|' + (S.year || '');
  };
  function recompute() {
    const subs = (S.config && S.config.subjects) || [], b = S.role === 'student' ? (S.sbatch || '') : curBatch();
    CLASSES = subs.filter((x) => x.branch + '|' + x.year === b).map((x) => ({ id: x.id, name: x.name, prof: x.prof || '' }));
    ROLLS = [];
    if (S.role === 'prof') S.students.forEach((v) => { if (!v.disabled && (v.batch || '') === b) { ROLLS.push(v.roll); NAMES[v.roll] = v.name || ''; } });
    ROLLS.sort(); TOTAL = ROLLS.length;
    if (!CLASSES.some((c) => c.id === S.cls)) S.cls = (CLASSES[0] || {}).id;
    if (!CLASSES.some((c) => c.id === S.regCls)) S.regCls = (CLASSES[0] || {}).id;
  }
  function batchBar() {
    const mk = (id, lab, arr, cur, on) => h('div', null, h('label', { for: id }, lab), h('select', { id, value: cur, onchange: (e) => { on(e.target.value); S.pending = null; render(); } }, arr.length ? arr.map((x) => h('option', { value: x }, x)) : h('option', { value: '' }, 'Add in Setup')));
    curBatch();
    const sl = sessionsOf();
    const sess = h('div', null, h('label', { for: 'bs' }, 'Session'), h('select', { id: 'bs', value: S.session, onchange: (e) => { S.session = e.target.value; try { localStorage.setItem('agx_sess', S.session); } catch (_) {} S.year = null; S.pending = null; render(); } },
      sl.length ? sl.map((x) => h('option', { value: x }, x + (x === activeSess() ? ' (current)' : ' (history)'))) : h('option', { value: '' }, 'Create in Setup')));
    return h('div', { class: 'batchbar' }, sess, mk('bb', 'Branch', branchesOf(), S.branch, (v) => { S.branch = v; }), mk('by', 'Year', yearsInSession(), S.year, (v) => { S.year = v; }));
  }

  // ---------- rendering ----------
  function render() { cancelAnimationFrame(rq); rq = requestAnimationFrame(doRender); }
  function doRender() {
    const app = $('app');
    app.replaceChildren(); recompute();
    if (!S.ready) return;
    if (!S.user) { app.append(viewLogin()); return; }
    if (S.role === 'student') {
      if (!S.activated) { app.append(viewSetPassword()); return; }
      const st = S.tab === 'college' || S.tab === 'cls' ? S.tab : 'dash';
      app.append(navBar([['dash', 'My attendance'], ['cls', 'My class'], ['college', 'College']], st), todayStrip(), st === 'college' ? viewCollege() : st === 'cls' ? viewMyClass() : viewStudent());
      return;
    }
    if (S.mustChange) { app.append(viewHodSetPassword()); return; }
    const tabs = [];
    if (S.isFaculty) tabs.push(['day', 'Day'], ['reg', 'Register'], ['chk', '75% check']);
    if (S.isDirector || S.mgrBranch) tabs.push(['ov', 'Overview']);
    if (S.isAdmin) tabs.push(['stu', 'Accounts'], ['setup', 'Setup']);
    tabs.push(['log', 'Changes'], ['college', 'College']);
    if (!tabs.some((t) => t[0] === S.tab)) S.tab = tabs[0][0];
    app.append(navBar(tabs, S.tab), batchBar(), todayStrip());
    syncBatchWatch();
    if (isPast()) app.append(h('p', { class: 'result warn' }, 'Session ' + S.session + ' is history. You can view and export it, but attendance cannot be changed or opened. Choose the current session to take attendance.'));
    app.append(!CLASSES.length && !['setup', 'stu', 'college', 'log', 'ov', 'staff'].includes(S.tab)
      ? h('div', { class: 'panel' }, h('p', { class: 'note' }, 'There is no subject for this branch and year yet. Open Setup and add the branch, year and subjects first.'))
      : ({ day: viewDay, reg: viewRegister, chk: viewCheck, stu: viewStudents, log: viewLog, setup: viewSetup, college: viewCollege, ov: viewOverview, staff: viewStaff }[S.tab] || viewDay)());
  }
  function navBar(items, cur) {
    return h('nav', { class: 'nav' },
      items.map(([id, label]) => h('button', { type: 'button', 'aria-selected': String(id === cur), onclick: () => { S.tab = id; S.pending = null; if (id === 'log') loadAudit(); if (id === 'cls' && !S.clsAt) loadClass(); if (id === 'ov' && ovStale()) loadOverview(); render(); } }, label)),
      h('span', { class: 'who' }, S.role === 'prof' && S.roleLabel ? h('span', { class: 'rolebadge' }, S.roleLabel) : null),
      h('button', { type: 'button', onclick: () => auth.signOut() }, 'Log out'));
  }

  // ---------- login ----------
  function viewLogin() {
    const id = h('input', { type: 'text', id: 'lid', autocomplete: 'username', placeholder: '2307370200001', spellcheck: 'false' });
    const pw = h('input', { type: 'password', id: 'lpw', autocomplete: 'current-password' });
    const out = h('p', { class: 'result', hidden: true, role: 'status' });
    const say = (t, k) => { out.textContent = t; out.className = 'result ' + k; out.hidden = !t; };
    async function go() {
      const v = id.value.trim();
      if (!v || !pw.value) return say('Enter your ID and password.', 'bad');
      let email = v;
      if (!v.includes('@')) { let ver = 0; try { const d = await db.doc('loginver/' + v).get(); ver = d.exists ? (d.data().v || 0) : 0; } catch (_) {} email = emailOf(v, ver); }
      say('Logging in', 'warn');
      try { await auth.signInWithEmailAndPassword(email, pw.value); }
      catch (e) {
        say(e && e.code === 'auth/too-many-requests' ? 'Too many tries. Wait a few minutes and try again.' : 'ID or password is wrong.', 'bad');
      }
    }
    async function forgot() {
      const v = id.value.trim();

  function branchData(branch) {

    const by = {}; subs.forEach((x) => { const k = x.branch + '|' + x.year; (by[k] = by[k] || []).push(x); });
    const rows = [];
    S.students.forEach((v) => {

      const yr = v.year || (v.batch || '').split('|')[1]; if (!years.includes(yr)) return;
      const marks = (S.ovRecords.get(v.roll)) || {}; let held = 0, att = 0;
      (by[v.batch || ''] || []).forEach((c) => { const t = statFor(marks, c.id); held += t.held; att += t.att; });
      rows.push({ roll: v.roll, name: v.name || '', year: yr, att, held, marks, pct: pctOf(att, held), short: isShort(att, held) });

  }

        if (!d.exists || d.data().roll !== S.roll) { banner('Your account is not set up for this class. Ask your professor.'); S.keepBanner = true; auth.signOut(); return; }
        if (d.data().disabled) { banner('Your login was replaced by your professor. Log in with your new activation code.'); S.keepBanner = true; auth.signOut(); return; }
        S.activated = !!d.data().activated; S.sbatch = d.data().batch || ''; S.myName = d.data().name || ''; banner('');
        const dd = d.data().device || '';
        if (S.activated && !dd && devId()) { try { await db.doc('students/' + u.uid).update({ device: devId() }); S.devOk = true; } catch (_) { S.devOk = false; } }
        else S.devOk = !dd || dd === devId();
        if (S.activated) startStudent();
      } catch (_) { banner('Could not load your account. Reload the page.'); }
    } else {
      const lo = em.toLowerCase(); S.role = 'prof';
      S.isDirector = DIRECTOR_EMAILS.includes(lo); S.mgrBranch = S.isDirector ? '' : (MGR[lo] || ''); S.mgrKey = bkOf(S.mgrBranch);
      S.isAdmin = S.isFaculty = !!S.mgrBranch; S.hodBranch = S.mgrBranch;
      if (!S.isDirector && !S.mgrBranch) { banner('This account is not authorised for AgixOn.'); S.keepBanner = true; auth.signOut(); return; }
      S.roleLabel = S.isDirector ? 'Director | view only, all branches' : 'HOD | ' + S.mgrBranch;
      S.tab = S.isDirector ? 'ov' : 'day'; S.ovYear = 'all'; banner('');
      startProf(); if (S.isDirector) loadOverview();
    }
    render();
  });
  render();
})();
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>

<script>
/* Install as app: Android/Chrome shows a real Install button; iPhone gets Add-to-Home-Screen steps. */
(function () {
  var box = document.getElementById('install'); if (!box) return;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  var dismissed = false; try { dismissed = localStorage.getItem('agx_install_x') === '1'; } catch (e) {}
  if (standalone || dismissed) return;
  var deferred = null;
  function close() { box.hidden = true; try { localStorage.setItem('agx_install_x', '1'); } catch (e) {} }
  function show(text, withBtn) {
    box.textContent = '';
    var p = document.createElement('p'); p.textContent = text; box.append(p);
    if (withBtn) {
      var b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = 'Install app';
      b.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; box.hidden = true; }); };
      box.append(b);
    }
    var x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.setAttribute('aria-label', 'Dismiss'); x.textContent = '\u00d7'; x.onclick = close; box.append(x);
    box.hidden = false;
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; show('Install AgixOn on your phone to open it like an app, without searching on Google.', true); });
  window.addEventListener('appinstalled', function () { box.hidden = true; });
  var ua = navigator.userAgent || '';
  if (/iphone|ipad|ipod/i.test(ua)) show('To install on iPhone: open this page in Safari, tap the Share button, then \u201cAdd to Home Screen\u201d.', false);
})();
</script>
<script>
(function () {
  var b = document.getElementById('themeBtn'), root = document.documentElement, m = document.querySelector('meta[name="theme-color"]');
  function paint() { var l = root.getAttribute('data-theme') === 'light'; b.textContent = l ? '\u263E Dark' : '\u2600 Light'; if (m) m.setAttribute('content', l ? '#f3f4fb' : '#090b10'); }
  b.onclick = function () { var n = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; root.setAttribute('data-theme', n); try { localStorage.setItem('agx_theme', n); } catch (e) {} paint(); };
  paint();
})();
</script>
