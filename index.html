  // ---------- small helpers ----------

  const fmtDate = (dk) => { const [y, m, d] = dk.split('-'); return parseInt(d, 10) + ' ' + MON[parseInt(m, 10) - 1] + ' ' + y; };
  const fmtMonth = (mk) => { const [y, m] = mk.split('-'); return MONTH_LONG[parseInt(m, 10) - 1] + ' ' + y; };
  const fmtClock = (ms) => { const s = Math.ceil(Math.max(0, ms) / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const isOpen = (l) => !!l && !l.closed && Date.now() < l.closesAt;

    const R = 6371000, r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
    const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));

      const m = {}; for (let t = Date.parse(a); t <= Date.parse(z) && Object.keys(m).length < 120; t += 86400000) m[new Date(t).toISOString().slice(0, 10)] = n;
      saveCfg({ holidays: m }, 'Holiday added.');
    };
    const delHol = async (d) => { try { await db.doc('config/main').update(new FP('holidays', d), FV.delete()); msg('cfg', 'Holiday removed.', 'ok'); } catch (_) { msg('cfg', 'Could not remove it. Try again.', 'bad'); } };
    return h('div', null,
      h('div', { class: 'panel' }, h('h2', null, 'Branches and years'), msgEl('cfg'),
        h('p', { class: 'hint' }, 'Start here. Add each branch (for example Electrical Engineering) and each year or batch (for example Final Year 2026-27). Add a new year name every session. Old years stay saved and can be opened from the year box at the top.'),
        h('label', null, 'Branches'), names('branches', br), adder('branches', 'nb', 'New branch name', br),
        h('label', null, 'Years'), names('years', yr), adder('years', 'ny', 'New year name', yr)),
      h('div', { class: 'panel' }, h('h2', null, 'Subjects'),
        h('p', { class: 'hint' }, 'A subject belongs to one branch and one year.'),
        h('ul', { class: 'list' }, subs.length ? subs.map((x) => h('li', null, x.name + ' (' + x.branch + ', ' + x.year + ') ', rmBtn(() => { if (ask(x.name)) saveCfg({ subjects: subs.filter((y) => y.id !== x.id) }, 'Removed ' + x.name + '.'); }))) : h('li', null, 'None yet.')),
        h('div', { class: 'row' },
          h('div', null, h('label', { for: 'sb' }, 'Branch'), h('select', { id: 'sb', value: S.branch }, opts(br))),
          h('div', null, h('label', { for: 'sy' }, 'Year'), h('select', { id: 'sy', value: S.year }, opts(yr))),
          h('div', null, h('label', { for: 'sn' }, 'Subject name'), h('input', { type: 'text', id: 'sn', placeholder: 'Subject name' }))),
        h('div', null, h('button', { class: 'btn small', type: 'button', onclick: addSub }, 'Add subject'))),
      h('div', { class: 'panel' }, h('h2', null, 'Holidays'),
        h('p', { class: 'hint' }, 'You cannot open an attendance window on a holiday. For a long break, also fill the last date.'),
        h('div', { class: 'row' },
          h('div', null, h('label', { for: 'hd' }, 'Date'), h('input', { type: 'date', id: 'hd' })),
          h('div', null, h('label', { for: 'hd2' }, 'Last date (optional)'), h('input', { type: 'date', id: 'hd2' })),
          h('div', null, h('label', { for: 'hn' }, 'Name'), h('input', { type: 'text', id: 'hn', placeholder: 'Diwali break' }))),
        h('div', null, h('button', { class: 'btn small', type: 'button', onclick: addHol }, 'Add holiday')),
        h('ul', { class: 'list' }, Object.keys(hol).sort().reverse().slice(0, 60).map((d) => h('li', null, fmtDate(d) + ': ' + hol[d] + ' ', rmBtn(() => delHol(d)))))),
      accountPanel());
  }

  // ---------- College: important links from recabn.ac.in ----------
  const WEB = 'https://www.recabn.ac.in/en/pages/';
  const COLLEGE_LINKS = [
    ['Academics', [['Academic calendar', WEB + 'academic-calendar'], ['List of holidays', WEB + 'list-of-holidays'], ['Time table', WEB + 'timetable'], ['Syllabus (AKTU)', 'https://aktu.ac.in/syllabus.html'], ['Academic rules and regulations', WEB + 'academics-rules-and-regulations']]],
    ['Exams and results', [['Examination notices', WEB + 'examination-notices'], ['Results', WEB + 'results'], ['Examination scheme', WEB + 'examination-scheme'], ['Previous year question papers', WEB + 'question-papers']]],
    ['Fees and scholarship', [['Online fee submission', 'https://pay.webfront.in/#/merchantinfo/rajkiya-engineering-college-ambedkar-nagar/9160'], ['College fee details', 'https://recabn.ac.in/en/pages/fee-structure-2'], ['UP scholarship portal', 'https://scholarship.up.gov.in/'], ['National Scholarship Portal', 'https://scholarships.gov.in']]],
    ['Notices', [['Notices and announcements', 'https://recabn.ac.in/pages/notices-announcements'], ['Electrical Engineering notices', WEB + 'electrical-engineering-notices'], ['Important information and links', 'https://recabn.ac.in/pages/important-information-links']]],
    ['Help and safety', [['Student grievance portal', WEB + 'student-grievance-portal'], ['Anti-ragging complaint', WEB + 'anti-anri'], ['Women\'s grievance cell', WEB + 'woman-harassment-cell']]],
    ['Campus', [['Library', WEB + 'library'], ['Placement cell', WEB + 'overview'], ['Hostels', WEB + 'hostels'], ['How to reach', WEB + 'how-to-reach']]]
  ];
  function viewCollege() {
    const a = (t, u) => h('a', { href: u, target: '_blank', rel: 'noopener noreferrer' }, t, h('span', { 'aria-hidden': 'true' }, '\u2197'));
    return h('div', null,
      h('div', { class: 'panel' }, h('h2', null, 'Rajkiya Engineering College, Ambedkar Nagar'),
        h('p', { class: 'note' }, 'AICTE approved government engineering college, affiliated to Dr. A.P.J. Abdul Kalam Technical University, Lucknow. AKTU college code 737.'),
        h('p', { class: 'note' }, 'Akbarpur-Tanda Road, in front of Hawai Patti, Katariya Yakoobpur, Ambedkar Nagar 224122'),
        h('div', { class: 'linkgrid' }, a('recabn.ac.in', 'https://recabn.ac.in/'), a('Call 05271-216656', 'tel:05271216656'), a('Call 05271-216657', 'tel:05271216657'), a('Open in Maps', 'https://www.google.com/maps/search/?api=1&query=26.454744,82.560775'))),
      COLLEGE_LINKS.map(([title, links]) => h('div', { class: 'panel' }, h('h3', null, title), h('div', { class: 'linkgrid' }, links.map(([t, u]) => a(t, u))))),
      h('p', { class: 'hint' }, 'These links open the official college website. If a page has moved, use the menu on recabn.ac.in.'));
  }

  // ---------- professor: Changes log ----------
  async function loadAudit() {
    try { const s = await db.collection('audit').orderBy('ts', 'desc').limit(100).get(); S.audit = s.docs.map((d) => d.data()); }
    catch (_) { S.audit = []; }
    render();
  }
  function viewLog() {
    const label = { mark: 'Marked present', unmark: 'Removed attendance', 'cancel-class': 'Cancelled class', 'restore-class': 'Counted class again', 'reset-device': 'Reset student phone', 'reset-login': 'Issued new login code' };
    return h('div', { class: 'panel' },
      h('div', { class: 'row tight' }, h('h2', null, 'Changes log'), h('button', { class: 'btn ghost small', type: 'button', onclick: loadAudit }, 'Refresh')),
      h('p', { class: 'hint' }, 'Every manual change is kept here with who made it and why. Latest 100.'),
      S.audit == null ? h('p', { class: 'note' }, 'Loading') : S.audit.length === 0 ? h('p', { class: 'note' }, 'No manual changes yet.') :
        h('ul', { class: 'list' }, S.audit.map((a) => h('li', null, h('b', null, label[a.action] || a.action), (a.roll ? ' ' + a.roll : ''), (a.classId ? ' for ' + clsName(a.classId) : '') + ' on ' + fmtDate(a.dateKey), a.reason ? '. Reason: ' + a.reason : '', h('br'), h('span', { class: 'hint' }, fmtDate(istDate(a.ts)) + ' ' + fmtTime(a.ts) + ' by ' + a.by)))));
  }

  // ---------- live clocks ----------
  setInterval(() => {
    document.querySelectorAll('.js-clock').forEach((el) => { el.textContent = fmtClock(parseInt(el.dataset.close, 10) - Date.now()); });
    const o = isOpen(S.live);
    if (o !== wasOpen) { wasOpen = o; render(); }
  }, 1000);

  // ---------- subscriptions ----------
  const stopAll = () => { unsubs.forEach((u) => { try { u(); } catch (_) {} }); unsubs = []; };
  const onErr = () => banner('Some data could not be loaded. Reload the page.');
  function watchShared() {
    unsubs.push(db.doc('config/main').onSnapshot((s) => { S.config = s.exists ? s.data() : {}; render(); }, onErr));
    unsubs.push(db.doc('live/current').onSnapshot((s) => { S.live = s.exists ? s.data() : null; render(); }, onErr));
    unsubs.push(db.collection('calendar').onSnapshot((s) => { const c = {}; s.docs.forEach((d) => { c[d.id] = d.data(); }); S.calendar = c; render(); }, onErr));
  }
  function startStudent() {
    stopAll(); watchShared();
    unsubs.push(db.doc('records/' + S.roll).onSnapshot((s) => { S.myMarks = s.exists ? (s.data().marks || {}) : {}; render(); }, onErr));
  }
  function startProf() {
    stopAll(); watchShared();
    unsubs.push(db.doc('secret/current').onSnapshot((x) => { S.secret = x.exists ? x.data() : null; render(); }, onErr));
    unsubs.push(db.collection('records').onSnapshot((s) => { const m = new Map(); s.docs.forEach((d) => m.set(d.id, d.data().marks || {})); S.records = m; render(); }, onErr));
    unsubs.push(db.collection('students').onSnapshot((s) => { const m = new Map(); s.docs.forEach((d) => m.set(d.id, Object.assign({ uid: d.id }, d.data()))); S.students = m; render(); }, onErr));
  }

  // ---------- boot ----------
  const configured = FIREBASE_CONFIG.apiKey && !/^PASTE/.test(FIREBASE_CONFIG.apiKey);
  if (!window.firebase) { banner('Could not load Firebase. Check your internet connection and reload.'); return; }
  if (!configured) { banner('Firebase is not set up yet. Follow SETUP.md and paste your config into index.html.'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.firestore(); FV = firebase.firestore.FieldValue; FP = firebase.firestore.FieldPath;
  let lastAct = Date.now();
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
  setInterval(() => { if (auth.currentUser && Date.now() - lastAct > (S.role === 'prof' ? 30 : 45) * 60000) auth.signOut(); }, 30000);
  auth.onAuthStateChanged(async (u) => {
    stopAll(); S.user = u; S.ready = true; S.live = null; S.myMarks = {}; S.records = new Map(); S.students = new Map(); S.pending = null; S.msgs = {}; S.audit = null;
    if (!u) { S.role = null; render(); return; }
    const em = u.email || '';
    if (em.endsWith('@' + DOMAIN)) {
      S.role = 'student'; S.roll = em.split('@')[0].split('.')[0];
      try {
        const d = await db.doc('students/' + u.uid).get();
        if (!d.exists || d.data().roll !== S.roll) { banner('Your account is not set up for this class. Ask your professor.'); auth.signOut(); return; }
        if (d.data().disabled) { banner('Your login was replaced by your professor. Log in with your new activation code.'); auth.signOut(); return; }
        S.activated = !!d.data().activated; S.sbatch = d.data().batch || ''; banner('');
        const dd = d.data().device || '';
        if (S.activated && !dd && devId()) { try { await db.doc('students/' + u.uid).update({ device: devId() }); S.devOk = true; } catch (_) { S.devOk = false; } }
        else S.devOk = !dd || dd === devId();
        if (S.activated) startStudent();
      } catch (_) { banner('Could not load your account. Reload the page.'); }
    } else { S.role = 'prof'; S.tab = 'day'; banner(''); startProf(); }
    render();
  });
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
